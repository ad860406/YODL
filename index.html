<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YODL - Descargas</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--border:#2a2f3a;--text:#e6e8ee;--muted:#9aa1b0;--accent:#4f8cff;--ok:#2ecc71;--err:#ff5c5c;--warn:#f5b942}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:22px;margin-bottom:4px}
.sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
input[type=url],textarea{width:100%;background:#0b0d12;border:1px solid var(--border);border-radius:8px;color:var(--text);padding:11px 12px;font-size:14px;outline:none}
input[type=url]:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px;resize:vertical;font-family:inherit}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.tipo{display:flex;gap:8px;flex:1;min-width:200px}
.tipo button{flex:1;padding:10px;border:1px solid var(--border);background:#0b0d12;color:var(--muted);border-radius:8px;cursor:pointer;font-size:14px;transition:.15s}
.tipo button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn{background:var(--accent);border:none;color:#fff;padding:11px 22px;border-radius:8px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;margin-left:6px}
.badge.audio{background:#223;color:#8fd3ff}
.badge.video{background:#322;color:#ffd08f}
.state{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.meta{font-size:12px;color:var(--muted);margin-top:4px}
.bar{height:8px;background:#0b0d12;border-radius:999px;overflow:hidden;margin-top:8px}
.fill{height:100%;background:var(--accent);width:0;transition:width .3s}
.fill.ok{background:var(--ok)}
.fill.err{background:var(--err)}
.pct{font-size:12px;font-weight:600;min-width:52px;text-align:right}
.st{font-size:13px}
.st.en_cola{color:var(--warn)}
.st.descargando{color:var(--accent)}
.st.completado{color:var(--ok)}
.st.error{color:var(--err)}
.url{font-size:12px;color:var(--muted);word-break:break-all;margin-top:4px}
.empty{color:var(--muted);text-align:center;padding:20px;font-size:14px}
.empty[hidden]{display:none}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.toolbar button{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.toolbar button:hover{color:var(--text);border-color:var(--accent)}
.err-text{color:var(--err);font-size:12px;margin-top:6px;word-break:break-all}
</style>
</head>
<body>
<div class="wrap">
  <h1>YODL <span style="font-size:12px;color:var(--muted)">· Descargador con yt-dlp</span></h1>
  <p class="sub">Pega uno o varios enlaces (YouTube, TikTok, Facebook, Instagram, X). Se detecta la red y se guarda en su carpeta, en cola.</p>

  <div class="card">
    <label for="urls">Enlaces (uno por línea)</label>
    <textarea id="urls" placeholder="https://www.youtube.com/watch?v=...&#10;https://www.tiktok.com/@.../video/...&#10;https://www.instagram.com/reel/..."></textarea>
    <div class="row">
      <div class="tipo" id="tipos">
        <button data-tipo="audio" class="on">Solo audio (MP3)</button>
        <button data-tipo="video">Solo video (MP4)</button>
      </div>
      <button class="btn" id="addBtn">Agregar a la cola</button>
    </div>
    <div class="err-text" id="formErr" hidden></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <label style="margin:0">Cola de descargas</label>
      <button id="refreshBtn">Actualizar</button>
    </div>
    <div id="jobs"></div>
    <div class="empty" id="empty">Sin descargas todavía.</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let tipoActual = 'audio';
const COLORS = {en_cola:'var(--warn)',descargando:'var(--accent)',completado:'var(--ok)',error:'var(--err)'};
const ETIQUETAS = {en_cola:'En cola',descargando:'Descargando',completado:'Completado',error:'Error'};

$('tipos').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  tipoActual = b.dataset.tipo;
  document.querySelectorAll('.tipo button').forEach(x=>x.classList.toggle('on', x===b));
});

$('addBtn').addEventListener('click', agregar);
$('refreshBtn').addEventListener('click', cargar);
$('urls').addEventListener('keydown', e => { if(e.key==='Enter' && (e.ctrlKey||e.metaKey)) agregar(); });

async function agregar(){
  const texto = $('urls').value.trim();
  if(!texto){ mostrarError('Pega al menos un enlace.'); return; }
  const urls = texto.split(/\n+/).map(s=>s.trim()).filter(Boolean);
  $('addBtn').disabled = true;
  $('formErr').hidden = true;
  try{
    for(const url of urls){
      const r = await fetch('/api/descargar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url,tipo:tipoActual})});
      if(!r.ok){ const j=await r.json().catch(()=>({})); mostrarError('Error en: '+url+' → '+(j.error||r.status)); }
    }
    $('urls').value='';
  }catch(err){ mostrarError(String(err)); }
  $('addBtn').disabled = false;
  cargar();
}

function mostrarError(m){ const e=$('formErr'); e.textContent=m; e.hidden=false; }

async function cargar(){
  let data;
  try{ data = await (await fetch('/api/estado')).json(); }catch{ return; }
  const c = data.trabajos || [];
  const el = $('jobs');
  el.innerHTML = '';
  $('empty').hidden = c.length>0;
  if(!c.length) return;
  c.slice().reverse().forEach(job=>{
    const div = document.createElement('div');
    div.style.cssText = 'border-bottom:1px solid var(--border);padding:10px 0;';
    div.innerHTML = `
      <div class="state">
        <div>
          <span class="st" style="color:${COLORS[job.estado]}">${ETIQUETAS[job.estado]||job.estado}</span>
          <span class="badge audio">${job.tipo}</span>
          <span class="badge" style="background:#2a2f3a;color:var(--text)">${job.red}</span>
        </div>
        <span class="pct">${job.progreso}%</span>
      </div>
      <div class="bar"><div class="fill ${job.estado==='completado'?'ok':job.estado==='error'?'err':''}" style="width:${job.progreso}%"></div></div>
      <div class="meta">${job.mensaje}</div>
      <div class="url">${job.url}</div>
      ${job.error?'<div class="err-text">'+job.error+'</div>':''}
    `;
    el.appendChild(div);
  });
}
cargar();
setInterval(cargar, 2000);
</script>
</body>
</html>
